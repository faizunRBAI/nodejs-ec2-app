---
- name: Configure Node.js EC2 App Server
  hosts: app
  become: true
  vars:
    app_dir: /opt/nodejs-ec2-app
    app_user: ubuntu
    node_version: "20"

  tasks:
    # ── System packages ───────────────────────────────────────────────────────
    - name: Install curl, gnupg and git
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - git
          - rsync
        state: present
        update_cache: true

    # ── Node.js 20 via NodeSource ─────────────────────────────────────────────
    - name: Download NodeSource setup script
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ node_version }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0755"

    - name: Run NodeSource setup script
      ansible.builtin.command: bash /tmp/nodesource_setup.sh
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    # ── nginx ─────────────────────────────────────────────────────────────────
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Copy nginx site config
      ansible.builtin.copy:
        src: files/nginx-app.conf
        dest: /etc/nginx/sites-available/app.conf
        mode: "0644"

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app.conf
        dest: /etc/nginx/sites-enabled/app.conf
        state: link

    - name: Test nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # ── Application directory ─────────────────────────────────────────────────
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    # ── Copy app files (rsync via shell — no extra collections needed) ────────
    - name: Copy application source to server
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ app_dir }}/{{ item.dest }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      loop:
        - { src: "../package.json",    dest: "package.json" }
        - { src: "../package-lock.json", dest: "package-lock.json" }
        - { src: "../nest-cli.json",   dest: "nest-cli.json" }
        - { src: "../tsconfig.json",   dest: "tsconfig.json" }

    - name: Copy src directory
      ansible.builtin.copy:
        src: "../src/"
        dest: "{{ app_dir }}/src/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"

    - name: Set app directory ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    # ── npm install + build ───────────────────────────────────────────────────
    - name: Install npm dependencies
      ansible.builtin.command: npm ci --omit=dev
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      environment:
        HOME: "/home/{{ app_user }}"

    - name: Install devDependencies for build
      ansible.builtin.command: npm install --save-dev @nestjs/cli typescript @nestjs/schematics
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      environment:
        HOME: "/home/{{ app_user }}"

    - name: Build NestJS application
      ansible.builtin.command: npm run build
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      environment:
        HOME: "/home/{{ app_user }}"

    # ── systemd ───────────────────────────────────────────────────────────────
    - name: Copy systemd service file
      ansible.builtin.copy:
        src: files/app.service
        dest: /etc/systemd/system/nodejs-ec2-app.service
        mode: "0644"

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start app service
      ansible.builtin.systemd:
        name: nodejs-ec2-app
        state: restarted
        enabled: true

    # ── Reload nginx after app starts ─────────────────────────────────────────
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
