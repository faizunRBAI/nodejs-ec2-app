name: CI/CD

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git ref or SHA to deploy'
        required: false
        default: ''
      udap_run_id:
        description: 'UDAP run id'
        required: false
        default: ''

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run lint

  # ── 2. Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm test

  # ── 3. Provision ─────────────────────────────────────────────────────────────
  provision:
    name: Provision
    runs-on: ubuntu-latest
    needs: test
    outputs:
      instance_ip: ${{ steps.tf_output.outputs.instance_ip }}
      instance_id: ${{ steps.tf_output.outputs.instance_id }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_project_name: nodejs-ec2-app
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
      - name: Capture outputs
        id: tf_output
        working-directory: infra
        run: |
          IP=$(terraform output -raw instance_ip)
          ID=$(terraform output -raw instance_id)
          echo "instance_ip=${IP}" >> "$GITHUB_OUTPUT"
          echo "instance_id=${ID}" >> "$GITHUB_OUTPUT"

  # ── 4. Deploy (via SSM) ───────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Package app
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='infra' \
              -czf /tmp/app.tar.gz .

      - name: Upload app to S3
        run: |
          aws s3 cp /tmp/app.tar.gz \
            s3://${{ secrets.TF_STATE_BUCKET }}/deployments/nodejs-ec2-app/app.tar.gz

      - name: Wait for SSM agent to be ready
        run: |
          for i in $(seq 1 24); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo None)
            echo "Attempt $i — SSM status: $STATUS"
            [ "$STATUS" = "Online" ] && break
            sleep 15
          done
          [ "$STATUS" = "Online" ] || { echo "SSM agent never came online"; exit 1; }

      - name: Deploy via SSM send-command
        id: ssm_cmd
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["
              set -e
              aws s3 cp s3://${{ secrets.TF_STATE_BUCKET }}/deployments/nodejs-ec2-app/app.tar.gz /tmp/app.tar.gz
              mkdir -p /home/ubuntu/app
              tar -xzf /tmp/app.tar.gz -C /home/ubuntu/app
              cd /home/ubuntu/app
              npm install --omit=dev
              pm2 delete nodejs-ec2-app 2>/dev/null || true
              pm2 start src/index.js --name nodejs-ec2-app
              pm2 save
            "] \
            --query 'Command.CommandId' \
            --output text)
          echo "cmd_id=${CMD_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to complete
        run: |
          CMD_ID=${{ steps.ssm_cmd.outputs.cmd_id }}
          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "Attempt $i — command status: $STATUS"
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] && {
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' --output text
              exit 1
            }
            sleep 15
          done
          echo "SSM command timed out"
          exit 1

  # ── 5. Verify ────────────────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [provision, deploy]
    env:
      EC2_IP: ${{ needs.provision.outputs.instance_ip }}
    steps:
      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://"$EC2_IP":3000/health || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "App is healthy!"
              echo "Live URL: http://$EC2_IP:3000"
              exit 0
            fi
            echo "Attempt $i — status $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "App did not become healthy in time"
          exit 1
