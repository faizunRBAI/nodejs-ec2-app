name: CI/CD

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git ref or SHA to deploy'
        required: false
        default: ''
      udap_run_id:
        description: 'UDAP run id'
        required: false
        default: ''

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run lint

  # ── 2. Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm test

  # ── 3. Provision ─────────────────────────────────────────────────────────────
  provision:
    name: Provision
    runs-on: ubuntu-latest
    needs: test
    outputs:
      instance_ip: ${{ steps.tf_output.outputs.instance_ip }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_project_name: nodejs-ec2-app
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
      - name: Capture outputs
        id: tf_output
        working-directory: infra
        run: |
          IP=$(terraform output -raw instance_ip)
          echo "instance_ip=${IP}" >> "$GITHUB_OUTPUT"

  # ── 4. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: provision
    env:
      EC2_IP: ${{ needs.provision.outputs.instance_ip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Wait for SSH
        run: |
          for i in $(seq 1 20); do
            ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no ubuntu@"$EC2_IP" echo OK && break
            echo "Waiting for SSH... attempt $i"
            sleep 15
          done
      - name: Copy app to EC2
        run: |
          rsync -az --exclude=node_modules --exclude=infra --exclude=.git \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ubuntu@"$EC2_IP":/home/ubuntu/app/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps and start with PM2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@"$EC2_IP" bash <<'ENDSSH'
            cd /home/ubuntu/app
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
            sudo apt-get install -y nodejs 2>/dev/null || true
            npm install --omit=dev
            sudo npm install -g pm2 2>/dev/null || true
            pm2 delete nodejs-ec2-app 2>/dev/null || true
            pm2 start src/index.js --name nodejs-ec2-app
            pm2 save
          ENDSSH

  # ── 5. Verify ────────────────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [provision, deploy]
    env:
      EC2_IP: ${{ needs.provision.outputs.instance_ip }}
    steps:
      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://"$EC2_IP":3000/health || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "App is healthy!"
              echo "Live URL: http://$EC2_IP:3000"
              exit 0
            fi
            echo "Attempt $i — status $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "App did not become healthy in time"
          exit 1
